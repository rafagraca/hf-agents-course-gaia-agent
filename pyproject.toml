[project]
name = "hf-agents-course-gaia-agent"
version = "0.1.0"
description = "A smolagents CodeAgent for the Hugging Face AI Agents Course final exam (Unit 4, GAIA subset)."
readme = "README.md"
requires-python = ">=3.12"
# Every package the code imports directly is declared here, even when another dependency would bring it in.
# smolagents[litellm] brings litellm (imported by gaia_agent.budget). smolagents is capped below 2 because the
# code reads two of its internals (the CodeAgent prompt file and the ActionStep/AgentError classes).
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "defusedxml>=0.7.1",
    "huggingface-hub>=0.34,<2",
    "lxml>=6.0",
    "markdownify>=1.2.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=11.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "smolagents[litellm]>=1.26.0,<2",
    "urllib3>=2.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jinja2>=3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
# A warning is a failure (the invalid-escape SyntaxWarning once silently broke a repair); a socket left open by a
# test is the garbage collector's business, not a finding.
filterwarnings = ["error", "ignore::ResourceWarning"]
markers = [
    "network: tests that need real network access (the network is blocked by default)",
]

[tool.coverage.run]
source = ["gaia_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "T20"]
ignore = ["SIM905"]  # a list of words reads better as "a b c".split() than as one quoted item per line

[tool.ruff.lint.per-file-ignores]
# Fixtures imported by name look like redefinitions to the linter; tests print and catch broadly on purpose.
"tests/*" = ["F811", "BLE001", "T201"]
# The command line helpers exist to print.
"gaia_agent/_cli.py" = ["T201"]
